[project]
name = "twitchio-pluralmind"
version = "1.0.0b1"
description = "Easily make your TwitchIO bot plural-friendly!"
readme = "README.md"
license = "MIT"
authors = [
    { name = "leahinmoonlight" },
]
requires-python = ">=3.12"
dependencies = [
    "twitchio>=3.1.0,<4",
    "pluralmind>=2.0.1,<3",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pluralmind.chat/"
Repository = "https://github.com/leahinmoonlight/twitchio-pluralmind.git"
Issues = "https://github.com/leahinmoonlight/twitchio-pluralmind/issues"
Changelog = "https://github.com/leahinmoonlight/twitchio-pluralmind/releases"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "ruff>=0.16.2",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "single"
preview = true

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    # flake8-bugbear
    "B",
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-logging-format
    "G",
    # isort
    "I",
    # flake8-logging
    "LOG",
    # Ruff-specific rules
    "RUF",
    # flake8-simplify
    "SIM",
    # flake8-type-checking
    "TC",
    # pyupgrade
    "UP",
    # Warning
    "W",
]
ignore = [
    # Ignore missing docstrings
    "D1",
    # prefer D211: No blank lines allowed before class docstring
    "D203",
    # Don't require summary line
    "D205",
    # prefer D213: Multi-line docstring summary should start at the second line
    "D212",
    # Loosen first line of docstring rules
    "D400",
    "D404",
    "D415",
    # Don't require imperative mood
    "D401",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80
